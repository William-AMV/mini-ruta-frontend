<div class="flex justify-content-center">
  <p-menu [style]="{width:'200px', border: 'none'}" [model]="items">
    <ng-template pTemplate="item" let-item>
      <a [attr.tabindex]="-1" class="p-menuitem-link flex justify-content-between align-items-center p-3" [style]="{color:'#4b5563'}" [routerLink]="item.routerLink">
        <div>
          <span [class]="item.icon"></span>
          <span> {{ item.label }}</span>
        </div>
      </a>
    </ng-template>

  </p-menu>

</div>
