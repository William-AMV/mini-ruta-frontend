<div class="layout-wrapper" [ngClass]="containerClass">
  @if (!localStorageService.getIsLoginFromSalesforce()) {
    <app-topbar></app-topbar>
  }
  <div class="layout-sidebar" [style]="withOutTopBarSideBar">
    <app-sidebar></app-sidebar>
  </div>
  <div class="layout-main-container" [style]="withOutTopBarContainer">
    <div class="layout-main">
      <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
  </div>
</div>
